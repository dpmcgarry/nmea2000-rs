[package]
name = "nmea2000-codegen"
description = "Build-time code generator for NMEA 2000 PGN types from canboat database"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quote = "1"
proc-macro2 = "1"
heck = "0.5"

[lints]
workspace = true
