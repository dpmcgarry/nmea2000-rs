[package]
name = "nmea2000-pgns"
description = "Generated NMEA 2000 PGN message types from canboat database"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["nmea2000-types/std"]

[dependencies]
nmea2000-types.workspace = true

[build-dependencies]
nmea2000-codegen.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[[bench]]
name = "decode_bench"
harness = false

[[bench]]
name = "throughput_bench"
harness = false

[lints]
workspace = true
